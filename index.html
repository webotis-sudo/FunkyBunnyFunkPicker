<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>funkybunnyfunkpicker</title>
  
  <!-- iOS PWA & Home Screen Icon Configuration -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="scent picker" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="icon" type="image/png" href="icon.png" />
  <link rel="manifest" href="manifest.json" />

  <!-- Cottagecore Tea Invitation Fonts -->
  <link rel="preconnect" href="https://googleapis.com" />
  <link rel="preconnect" href="https://gstatic.com" crossorigin />
  <link href="https://googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #F3E8C8;           /* Warm courtyard ochre wall */
      --card: #FCF8EE;         /* Soft cream card surface */
      --text: #2B231D;         /* Dark teak wood text */
      --muted: #685B4F;        /* Warm taupe secondary text */
      --green: #487A47;        /* Rainy courtyard garden green */
      --green-dark: #386137;   /* Deep foliage green active state */
      --primary: #3A7D7C;      /* Vintage painted teal doors/pillars */
      --primary-dark: #2A5E5D; /* Deep teal active state */
      --accent: #E3D4AE;       /* Warm sand border & tab track */
      --pill-bg: #DCE9E7;      /* Soft seafoam/teal pill background */
      --pill-text: #235352;    /* Deep teal pill text */
      --terracotta: #A84A32;   /* Wet terracotta floor tile */
      --terracotta-bg: #F6E2DC;/* Soft terracotta tint */
      --radius: 16px;
    }

    * { 
      box-sizing: border-box; 
      font-family: 'Lora', Georgia, serif;
      text-transform: lowercase;
    }
    
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      padding-bottom: 80px;
    }

    /* Navigation Tabs */
    .nav-tabs {
      display: flex;
      gap: 6px;
      background: var(--accent);
      padding: 5px;
      border-radius: var(--radius);
      margin-bottom: 20px;
    }
    .nav-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 11px;
      background: transparent;
      color: var(--text);
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 500;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .nav-btn.active {
      background: var(--card);
      color: var(--green-dark);
      box-shadow: 0 2px 4px rgba(43, 35, 29, 0.1);
    }

    /* Views */
    .view { display: none; }
    .view.active { display: block; }

    /* Buttons */
    .btn-primary {
      width: 100%;
      padding: 17px;
      background: var(--green);
      color: #FCF8EE;
      border: none;
      border-radius: var(--radius);
      font-family: 'Fraunces', Georgia, serif;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0.2px;
      cursor: pointer;
      margin-bottom: 12px;
      box-shadow: 0 3px 8px rgba(72, 122, 71, 0.28);
    }
    .btn-primary:active {
      background: var(--green-dark);
    }

    .group-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }
    .btn-group {
      padding: 13px;
      background: var(--card);
      color: var(--text);
      border: 1.5px solid var(--accent);
      border-radius: var(--radius);
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 500;
      font-size: 15px;
      cursor: pointer;
    }
    .btn-group:active {
      background: var(--pill-bg);
      border-color: var(--primary);
    }

    /* Result Card */
    .card {
      background: var(--card);
      border: 1.5px solid var(--accent);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: 0 4px 12px rgba(43, 35, 29, 0.08);
      margin-top: 10px;
    }
    .location-pill {
      display: inline-block;
      background: var(--pill-bg);
      color: var(--pill-text);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .perfume-title { 
      margin: 0 0 10px 0; 
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 600;
      font-size: 22px; 
      color: var(--text);
    }
    .perfume-history { 
      margin: 0 0 20px 0; 
      line-height: 1.6; 
      color: var(--muted); 
      font-size: 15px; 
    }
    
    .btn-used {
      width: 100%;
      padding: 13px;
      background: var(--terracotta-bg);
      color: var(--terracotta);
      border: 1px solid rgba(168, 74, 50, 0.25);
      border-radius: 11px;
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 500;
      font-size: 15px;
      cursor: pointer;
    }
    .undo-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--terracotta);
      color: #FCF8EE;
      padding: 12px 16px;
      border-radius: var(--radius);
      margin-top: 12px;
      font-size: 14px;
    }
    .undo-bar button {
      background: #FCF8EE;
      color: var(--terracotta);
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 600;
      cursor: pointer;
    }

    /* Search View */
    .search-input {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      background: var(--card);
      color: var(--text);
      border: 1.5px solid var(--accent);
      border-radius: var(--radius);
      margin-bottom: 16px;
      outline: none;
    }
    .search-input:focus {
      border-color: var(--green);
    }
    .list-item {
      background: var(--card);
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--accent);
    }
    .badge-empty {
      background: var(--terracotta-bg);
      color: var(--terracotta);
      font-size: 11px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 6px;
      margin-left: 6px;
    }

    /* Backup Footer */
    .backup-box {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1.5px solid var(--accent);
      display: flex;
      gap: 8px;
    }
    .backup-box button {
      flex: 1;
      padding: 11px;
      background: var(--accent);
      color: var(--text);
      border: none;
      border-radius: 11px;
      font-family: 'Fraunces', Georgia, serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- view switcher -->
  <nav class="nav-tabs">
    <button class="nav-btn active" onclick="switchView('pick', this)">pick a scent</button>
    <button class="nav-btn" onclick="switchView('find', this)">find a spot</button>
  </nav>

  <!-- view 1: pick a scent -->
  <section id="view-pick" class="view active">
    <button class="btn-primary" onclick="pickRandom()">pick a sweetness</button>
    
    <div class="group-grid">
      <button class="btn-group" onclick="pickRandom('Fresh')">fresh</button>
      <button class="btn-group" onclick="pickRandom('Floral')">floral</button>
      <button class="btn-group" onclick="pickRandom('Warm/Spicy')">warm / spicy</button>
      <button class="btn-group" onclick="pickRandom('Date Night')">date night</button>
    </div>

    <div id="result-container"></div>
    <div id="undo-container"></div>
  </section>

  <!-- view 2: find a spot -->
  <section id="view-find" class="view">
    <input type="text" id="search-box" class="search-input" placeholder="search 500 samples by name..." oninput="renderSearch()" />
    <div id="search-results"></div>

    <div class="backup-box">
      <button onclick="copyBackup()">copy used list</button>
      <button onclick="restoreBackup()">restore list</button>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
